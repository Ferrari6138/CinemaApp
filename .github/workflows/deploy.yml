name: Deploy to Railway

on:
  push:
    branches:
      - main # Altere para master caso sua branch principal no GitHub se chame master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service cinema-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
