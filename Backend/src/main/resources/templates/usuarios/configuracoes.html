<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div th:if="${success}" class="alert alert-cinema alert-success alert-dismissible fade show mb-3">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-cinema alert-danger alert-dismissible fade show mb-3">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Avatar -->
            <div class="cinema-card mb-4">
                <div class="card-header"><i class="bi bi-image text-accent me-2"></i>Foto de Perfil</div>
                <div class="p-4 cinema-form">
                    <div class="mb-3 d-flex align-items-center gap-3">
                        <img th:if="${user.avatar != null}"
                             th:src="@{/uploads/{a}(a=${user.avatar})}"
                             style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)">
                        <img th:if="${user.avatar == null}"
                             th:src="@{/uploads/default-avatar.jpg}"
                             style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--border)">
                        <div class="text-dim" style="font-size:0.85rem">
                            <strong th:text="${user.nome}">Nome</strong><br>
                            <span th:text="${user.email}">email</span>
                        </div>
                    </div>
                    <form th:action="@{/usuarios/configuracoes/avatar}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Nova foto (JPG, PNG — máx 10MB)</label>
                            <input type="file" name="avatar" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-cinema btn-sm">
                            <i class="bi bi-upload me-1"></i>Atualizar Foto
                        </button>
                    </form>
                </div>
            </div>

            <!-- Password -->
            <div class="cinema-card">
                <div class="card-header"><i class="bi bi-lock text-accent me-2"></i>Alterar Senha</div>
                <div class="p-4 cinema-form">
                    <form th:action="@{/usuarios/configuracoes/senha}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nova senha</label>
                            <input type="password" name="novaSenha" class="form-control"
                                   placeholder="Mín. 6 caracteres" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirmar nova senha</label>
                            <input type="password" name="confirmaSenha" class="form-control"
                                   placeholder="Repita a senha" required>
                        </div>
                        <button type="submit" class="btn btn-outline-cinema btn-sm">
                            <i class="bi bi-shield-check me-1"></i>Alterar Senha
                        </button>
                    </form>
                </div>
            </div>

            <div class="mt-3">
                <a th:href="@{/usuarios/perfil}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao perfil
                </a>
            </div>
        </div>
    </div>
</div>

<footer class="cinema-footer">
    <div class="container">&copy; 2025 CinemaApp. Todos os direitos reservados.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
