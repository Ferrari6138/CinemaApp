<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div th:if="${success}" class="alert alert-cinema alert-success alert-dismissible fade show mb-3">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="cinema-card mb-4">
                <div class="card-header"><i class="bi bi-person text-accent me-2"></i>Meu Perfil</div>
                <div class="p-4 d-flex align-items-center gap-4">
                    <div style="position:relative">
                        <img th:if="${user.avatar != null}"
                             th:src="@{/uploads/{a}(a=${user.avatar})}"
                             style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)">
                        <img th:if="${user.avatar == null}"
                             th:src="@{/uploads/default-avatar.jpg}"
                             style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--border)">
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1" th:text="${user.nome}">Nome</h5>
                        <div class="text-dim" th:text="${user.email}">email</div>
                        <div class="mt-2">
                            <span th:if="${user.role == 'ADMIN'}"
                                  class="badge-genero" style="color:#f5c518;border-color:#f5c518">
                                <i class="bi bi-shield-fill me-1"></i>Admin
                            </span>
                            <span th:if="${user.role != 'ADMIN'}" class="badge-genero">
                                <i class="bi bi-person me-1"></i>Usuário
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/usuarios/configuracoes}" class="btn btn-outline-cinema btn-sm">
                    <i class="bi bi-gear me-1"></i>Configurações
                </a>
                <a th:href="@{/reservas/minhas}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-ticket-perforated me-1"></i>Minhas Reservas
                </a>
            </div>
        </div>
    </div>
</div>

<footer class="cinema-footer">
    <div class="container">&copy; 2025 CinemaApp. Todos os direitos reservados.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
