<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Reservas | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">

    <div th:if="${success}" class="alert alert-cinema alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-ticket-perforated text-accent me-2"></i>Minhas Reservas
        </h4>
        <a th:href="@{/filmes}" class="btn btn-cinema btn-sm">
            <i class="bi bi-camera-reels me-1"></i>Ver Filmes
        </a>
    </div>

    <div th:if="${!reservas.empty}" class="cinema-table">
        <table>
            <thead>
                <tr>
                    <th>Filme</th>
                    <th>Sessão</th>
                    <th>Assentos</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservas}">
                    <td>
                        <div class="fw-semibold" th:text="${r.sessao.filme.titulo}">Filme</div>
                        <div class="text-dim" style="font-size:0.8rem"
                             th:text="${r.sessao.filme.classificacao}">14+</div>
                    </td>
                    <td>
                        <div th:text="${#temporals.format(r.sessao.dataHora, 'dd/MM/yyyy HH:mm')}">Data</div>
                        <div class="text-dim" style="font-size:0.8rem" th:text="${r.sessao.sala}">Sala 1</div>
                    </td>
                    <td>
                        <div class="text-accent fw-semibold"
                             th:text="${r.assentos != null ? r.assentos : '-'}">A1,A2</div>
                        <div class="text-dim" style="font-size:0.8rem"
                             th:text="${r.quantidade + (r.quantidade == 1 ? ' ingresso' : ' ingressos')}">2 ingressos</div>
                    </td>
                    <td>
                        <span class="fw-bold" style="color:#f5c518"
                              th:text="'R$ ' + ${r.getValorTotalFormatado()}">R$ 50,00</span>
                    </td>
                    <td>
                        <span th:switch="${r.status}">
                            <span th:case="'CONFIRMADA'" class="badge-confirmada">Confirmada</span>
                            <span th:case="'CANCELADA'" class="badge-cancelada">Cancelada</span>
                            <span th:case="'FINALIZADA'" class="badge-finalizada">Finalizada</span>
                        </span>
                    </td>
                    <td>
                        <form th:if="${r.status == 'CONFIRMADA'}"
                              th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post"
                              onsubmit="return confirm('Cancelar esta reserva?')">
                            <button type="submit" class="btn btn-sm btn-ghost" style="font-size:0.75rem">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${reservas.empty}" class="text-center py-5">
        <div style="font-size:5rem; opacity:0.3"><i class="bi bi-ticket-perforated"></i></div>
        <h4 class="text-dim mt-3">Nenhuma reserva ativa</h4>
        <p class="text-dim">Escolha um filme e reserve seus ingressos!</p>
        <a th:href="@{/filmes}" class="btn btn-cinema mt-2">Ver Filmes</a>
    </div>
</div>

<footer class="cinema-footer">
    <div class="container">&copy; 2025 CinemaApp. Todos os direitos reservados.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
