<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemas | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">

    <div th:if="${success}" class="alert alert-cinema alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-cinema alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-geo-alt text-accent me-2"></i>Cinemas
        </h4>
        <a th:href="@{/admin/cinemas/novo}" class="btn btn-cinema btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Novo Cinema
        </a>
    </div>

    <div th:if="${!cinemas.empty}" class="cinema-table">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Endereço</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cinemas}">
                    <td th:text="${c.nome}">Nome</td>
                    <td th:text="${c.endereco != null ? c.endereco : '-'}">Endereço</td>
                    <td>
                        <a th:href="@{/admin/cinemas/editar/{id}(id=${c.id})}" class="btn btn-sm btn-ghost">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/admin/cinemas/{id}/deletar(id=${c.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('Remover este cinema?')">
                            <button type="submit" class="btn btn-sm btn-ghost">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${cinemas.empty}" class="text-center py-5 text-dim">
        <i class="bi bi-geo-alt" style="font-size:2rem; opacity:0.3"></i>
        <p class="mt-2">Nenhum cinema cadastrado.</p>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/dashboard}" class="btn btn-ghost btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Voltar ao dashboard
        </a>
    </div>
</div>

<footer class="cinema-footer">
    <div class="container">&copy; 2025 CinemaApp. Todos os direitos reservados.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
