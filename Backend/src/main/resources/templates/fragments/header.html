<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | CinemaApp' : 'CinemaApp'}">CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<nav th:fragment="navbar" class="cinema-nav navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/filmes}">
            <i class="bi bi-camera-reels-fill"></i> CinemaApp
        </a>
        <button class="navbar-toggler border-secondary" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/filmes}"><i class="bi bi-film"></i> Filmes</a>
                </li>
                <li class="nav-item" th:if="${user != null}">
                    <a class="nav-link" th:href="@{/reservas/minhas}">
                        <i class="bi bi-ticket-perforated"></i> Minhas Reservas
                    </a>
                </li>
            </ul>

            <!-- Busca -->
            <form class="search-form d-flex me-3" th:action="@{/filmes}" method="get">
                <input class="form-control form-control-sm" type="search" name="q"
                       placeholder="Buscar filmes..." th:value="${q}">
                <button class="btn btn-search btn-sm" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <ul class="navbar-nav">
                <!-- Admin menu -->
                <li class="nav-item dropdown me-2" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle text-warning" href="#"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-shield-fill"></i> Admin
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin/dashboard}">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                        <li><a class="dropdown-item" th:href="@{/filmes/novo}">
                            <i class="bi bi-plus-circle me-2"></i>Novo Filme</a></li>
                        <li><a class="dropdown-item" th:href="@{/filmes}">
                            <i class="bi bi-collection-play me-2"></i>Gerenciar Filmes</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/cinemas}">
                            <i class="bi bi-geo-alt me-2"></i>Cinemas</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/reservas}">
                            <i class="bi bi-ticket-perforated me-2"></i>Todas as Reservas</a></li>
                    </ul>
                </li>

                <!-- User dropdown -->
                <li class="nav-item dropdown" th:if="${user != null}">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2"
                       href="#" data-bs-toggle="dropdown">
                        <img th:if="${user.avatar != null}"
                             th:src="@{/uploads/{a}(a=${user.avatar})}"
                             class="avatar-circle" alt="Avatar">
                        <img th:if="${user.avatar == null}"
                             th:src="@{/uploads/default-avatar.jpg}"
                             class="avatar-circle" alt="Avatar">
                        <span class="d-none d-md-inline" th:text="${user.nome}">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/usuarios/perfil}">
                            <i class="bi bi-person me-2"></i>Perfil</a></li>
                        <li><a class="dropdown-item" th:href="@{/usuarios/configuracoes}">
                            <i class="bi bi-gear me-2"></i>Configurações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
