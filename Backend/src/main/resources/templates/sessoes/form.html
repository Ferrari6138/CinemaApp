<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sessão | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="cinema-card">
                <div class="card-header">
                    <i class="bi bi-calendar-plus text-accent me-2"></i>Nova Sessão
                    <span class="text-dim ms-2" style="font-size:0.85rem" th:text="'— ' + ${filme.titulo}">— Filme</span>
                </div>
                <div class="p-4 cinema-form">
                    <form th:action="@{/sessoes/nova/{id}(id=${filme.id})}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Cinema *</label>
                            <select name="cinemaId" class="form-select" required>
                                <option value="">Selecione um cinema</option>
                                <option th:each="c : ${cinemas}" th:value="${c.id}" th:text="${c.nome}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Data e Hora *</label>
                            <input type="datetime-local" name="dataHora" class="form-control"
                                   required min="1">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Sala *</label>
                            <select name="sala" class="form-select" required>
                                <option value="">Selecione uma sala</option>
                                <option value="Sala 1">Sala 1</option>
                                <option value="Sala 2">Sala 2</option>
                                <option value="Sala 3">Sala 3</option>
                                <option value="Sala VIP">Sala VIP</option>
                                <option value="IMAX">IMAX</option>
                                <option value="3D">3D</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Capacidade *</label>
                            <input type="number" name="capacidade" class="form-control"
                                   value="100" min="10" max="100" required>
                            <div class="text-dim mt-1" style="font-size:0.8rem">
                                O mapa de assentos suporta no máximo 100 lugares (10 fileiras × 10 assentos)
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-cinema">
                                <i class="bi bi-check2 me-1"></i>Criar Sessão
                            </button>
                            <a th:href="@{/filmes/{id}(id=${filme.id})}" class="btn btn-ghost">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
