<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-camera-reels-fill"></i> CinemaApp</div>
        <div class="auth-subtitle">Informe seu e-mail para receber o link de recuperação.</div>

        <div th:if="${message}" class="alert alert-cinema alert-success mb-3">
            <i class="bi bi-check-circle me-2"></i><span th:text="${message}">Mensagem</span>
        </div>
        <div th:if="${error}" class="alert alert-cinema alert-danger mb-3">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}">Erro</span>
        </div>

        <form th:action="@{/auth/forgot-password}" method="post" class="cinema-form">
            <div class="mb-4">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-cinema w-100 mb-3">
                <i class="bi bi-send me-2"></i>Enviar link de recuperação
            </button>
            <div class="text-center text-dim" style="font-size:0.85rem">
                <a th:href="@{/auth/login}" class="text-accent" style="text-decoration:none">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao login
                </a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
