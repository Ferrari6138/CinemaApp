<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-camera-reels-fill"></i> CinemaApp</div>
        <div class="auth-subtitle">Escolha uma nova senha para sua conta.</div>

        <div th:if="${message}" class="alert alert-cinema alert-success mb-3">
            <i class="bi bi-check-circle me-2"></i><span th:text="${message}">Mensagem</span>
        </div>
        <div th:if="${error}" class="alert alert-cinema alert-danger mb-3">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}">Erro</span>
        </div>

        <form th:action="@{/auth/reset-password}" method="post" class="cinema-form">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-4">
                <label class="form-label">Nova senha</label>
                <input type="password" name="newPassword" class="form-control"
                       placeholder="Mín. 6 caracteres (maiúscula, minúscula, número)" required>
                <div class="text-dim mt-1" style="font-size:0.78rem">
                    <i class="bi bi-info-circle me-1"></i>Use letras maiúsculas, minúsculas e números
                </div>
            </div>
            <button type="submit" class="btn btn-cinema w-100 mb-3">
                <i class="bi bi-shield-check me-2"></i>Redefinir senha
            </button>
            <div class="text-center text-dim" style="font-size:0.85rem">
                <a th:href="@{/auth/login}" class="text-accent" style="text-decoration:none">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao login
                </a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
