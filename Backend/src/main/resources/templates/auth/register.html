<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card" style="max-width:460px">
        <div class="auth-logo"><i class="bi bi-camera-reels-fill"></i> CinemaApp</div>
        <div class="auth-subtitle">Crie sua conta e compre ingressos!</div>

        <div th:if="${error}" class="alert alert-cinema alert-danger mb-3">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}">Erro</span>
        </div>

        <form th:action="@{/auth/register}" method="post" class="cinema-form"
              th:object="${usuario}">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-cinema alert-danger mb-3">
                <ul class="mb-0" style="padding-left:1.2rem">
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" th:field="*{nome}" class="form-control"
                       placeholder="Seu nome" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" th:field="*{senha}" class="form-control"
                       placeholder="Mín. 6 caracteres (maiúscula, minúscula, número)" required>
                <div class="text-dim mt-1" style="font-size:0.78rem">
                    <i class="bi bi-info-circle me-1"></i>Use letras maiúsculas, minúsculas e números
                </div>
            </div>

            <button type="submit" class="btn btn-cinema w-100 mb-3">
                <i class="bi bi-person-plus me-2"></i>Criar Conta
            </button>
            <div class="text-center text-dim" style="font-size:0.85rem">
                Já tem conta?
                <a th:href="@{/auth/login}" class="text-accent" style="text-decoration:none"> Entrar</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
