<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes em Cartaz | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">

    <div th:if="${success}" class="alert alert-cinema alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-cinema alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold mb-0">
            <i class="bi bi-camera-reels text-accent me-2"></i>Em Cartaz
        </h1>
        <a th:href="@{/filmes/novo}" sec:authorize="hasRole('ADMIN')" class="btn btn-cinema btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Novo Filme
        </a>
    </div>

    <div class="genre-filter">
        <a th:href="@{/filmes}" class="genre-chip"
           th:classappend="${generoId == null and (q == null or #strings.isEmpty(q))} ? ' active' : ''">Todos</a>
        <a th:each="g : ${generos}"
           th:href="@{/filmes(generoId=${g.id})}"
           th:text="${g.nome}"
           class="genre-chip"
           th:classappend="${generoId != null and generoId == g.id} ? ' active' : ''"></a>
    </div>

    <p th:if="${q != null and !#strings.isEmpty(q)}" class="text-dim mb-3">
        <i class="bi bi-search me-1"></i>
        Resultados para "<strong th:text="${q}"></strong>"
        — <a th:href="@{/filmes}" class="text-accent" style="text-decoration:none">Limpar</a>
    </p>

    <div class="film-grid" th:if="${!filmes.empty}">
        <a th:each="filme : ${filmes}"
           th:href="@{/filmes/{id}(id=${filme.id})}"
           class="film-card">
            <div class="film-card-poster">
                <img th:if="${filme.imagem != null}"
                     th:src="${filme.imagem.startsWith('http') ? filme.imagem : '/uploads/' + filme.imagem}"
                     th:alt="${filme.titulo}" loading="lazy">
                <div th:if="${filme.imagem == null}" class="no-poster">
                    <i class="bi bi-film"></i>
                </div>
                <div class="film-card-overlay">
                    <div class="d-flex gap-1 flex-wrap">
                        <span th:each="g : ${filme.generos}" class="badge-genero" th:text="${g.nome}"></span>
                    </div>
                </div>
            </div>
            <div class="film-card-body">
                <div class="film-card-title" th:text="${filme.titulo}">Título</div>
                <div class="film-card-meta">
                    <span th:if="${filme.duracao != null}" th:text="${filme.getDuracaoFormatada()}">2h</span>
                    <span th:if="${filme.classificacao != null}" class="badge-genero" th:text="${filme.classificacao}">14+</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="film-card-price" th:text="'R$ ' + ${filme.getPrecoFormatado()}">R$ 25,00</span>
                    <span class="text-accent" style="font-size:0.8rem">Ver sessões →</span>
                </div>
            </div>
        </a>
    </div>

    <div th:if="${filmes.empty}" class="text-center py-5">
        <div style="font-size:5rem; opacity:0.3"><i class="bi bi-camera-reels"></i></div>
        <h4 class="text-dim mt-3">Nenhum filme encontrado</h4>
        <a th:href="@{/filmes}" class="text-accent">Ver todos os filmes</a>
    </div>
</div>

<footer class="cinema-footer">
    <div class="container">&copy; 2025 CinemaApp. Todos os direitos reservados.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
