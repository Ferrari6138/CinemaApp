<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${filme.id != null ? 'Editar Filme' : 'Novo Filme'} + ' | CinemaApp'">Filme | CinemaApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cinema.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="cinema-card">
                <div class="card-header">
                    <i class="bi bi-film text-accent me-2"></i>
                    <span th:text="${filme.id != null ? 'Editar Filme' : 'Novo Filme'}">Filme</span>
                </div>
                <div class="p-4 cinema-form">
                    <form th:action="${filme.id != null ? '/filmes/editar/' + filme.id : '/filmes/novo'}"
                          method="post" enctype="multipart/form-data">

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Título *</label>
                                <input type="text" name="titulo" class="form-control"
                                       th:value="${filme.titulo}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ano</label>
                                <input type="number" name="ano" class="form-control"
                                       th:value="${filme.ano}" min="1900" max="2099">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Descrição</label>
                                <textarea name="descricao" class="form-control" rows="4"
                                          th:text="${filme.descricao}"></textarea>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Duração (min)</label>
                                <input type="number" name="duracao" class="form-control"
                                       th:value="${filme.duracao}" min="1">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Classificação</label>
                                <select name="classificacao" class="form-select">
                                    <option value="">Livre</option>
                                    <option th:each="c : ${ {'10+','12+','14+','16+','18+'} }"
                                            th:value="${c}" th:text="${c}"
                                            th:selected="${filme.classificacao == c}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Preço (R$) *</label>
                                <input type="text" name="preco" class="form-control"
                                       th:value="${filme.getPrecoFormatado()}"
                                       placeholder="25,00" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Gêneros</label>
                                <div class="genre-checkboxes">
                                    <label th:each="g : ${generos}" class="genre-check-item">
                                        <input type="checkbox" name="generoIds"
                                               th:value="${g.id}"
                                               th:checked="${#lists.contains(filme.generos, g)}">
                                        <span th:text="${g.nome}">Gênero</span>
                                    </label>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label d-flex align-items-center gap-2" style="cursor:pointer">
                                    <input type="checkbox" name="emCartaz" value="true"
                                           th:checked="${filme.id == null or filme.isEmCartaz()}">
                                    Em cartaz (visível no catálogo)
                                </label>
                                <div th:if="${filme.tmdbId != null}" class="text-dim mt-1" style="font-size:0.8rem">
                                    <i class="bi bi-robot me-1"></i>Filme importado automaticamente do TMDB — o gestor
                                    automático pode reativar isto sozinho se o filme voltar a estar em cartaz.
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Capa do Filme</label>
                                <div th:if="${filme.imagem != null}" class="mb-2">
                                    <img th:src="${filme.imagem.startsWith('http') ? filme.imagem : '/uploads/' + filme.imagem}"
                                         style="height:80px; border-radius:8px; object-fit:cover">
                                    <span class="text-dim ms-2" style="font-size:0.8rem">Imagem atual</span>
                                </div>
                                <input type="file" name="file" class="form-control" accept="image/*">
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-cinema">
                                <i class="bi bi-check2 me-1"></i>
                                <span th:text="${filme.id != null ? 'Atualizar' : 'Cadastrar'}">Salvar</span>
                            </button>
                            <a th:href="${filme.id != null ? '/filmes/' + filme.id : '/filmes'}"
                               class="btn btn-ghost">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
