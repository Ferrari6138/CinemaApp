spring.application.name=CinemaApp
server.port=${PORT:8080}

# ========================
# NEON POSTGRESQL
# ========================
# Sem valores padrao de proposito: credenciais reais NAO devem ficar neste arquivo
# (ele e versionado no git). Defina DB_URL, DB_USERNAME e DB_PASSWORD como variaveis
# de ambiente (no Railway: aba Variables do servico; localmente: no seu shell).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ========================
# JPA/HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ========================
# SESSAO JDBC
# ========================
server.servlet.session.timeout=1800
server.servlet.session.cookie.name=CINEMA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=COOKIE
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

# ========================
# THYMELEAF
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ========================
# UPLOAD DE ARQUIVOS
# ========================
# Diretorio onde os posteres enviados pelo admin sao salvos. Em producao (Railway),
# aponte UPLOAD_DIR para um Volume persistente - o filesystem do container e efemero
# e é recriado a cada deploy/restart, apagando qualquer upload feito no caminho padrao.
app.upload.dir=${UPLOAD_DIR:./uploads/}
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# EMAIL (Gmail)
# ========================
# Sem valores padrao (mesmo motivo do datasource acima). Defina MAIL_USER e
# MAIL_PASSWORD (senha de app do Gmail, nao a senha da conta) como variaveis de ambiente.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# URL BASE (usada em links enviados por e-mail, ex: recuperacao de senha)
# ========================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ========================
# ERROS
# ========================
server.error.include-stacktrace=on_param
server.mvc.pathmatch.matching-strategy=ant_path_matcher

# ========================
# GESTOR DE CINEMA AUTOMATICO (TMDB + geracao de sessoes)
# ========================
# Chave gratuita da API do TMDB (https://www.themoviedb.org/settings/api). Sem ela,
# a importacao de filmes fica desativada, mas a geracao de sessoes futuras continua ativa.
app.tmdb.api-key=${TMDB_API_KEY:}
# Cron de execucao diaria do gestor (padrao: todo dia as 03:00)
app.cinema.scheduler.cron=${CINEMA_SCHEDULER_CRON:0 0 3 * * *}
# Preco padrao atribuido a filmes importados automaticamente
app.cinema.preco-padrao=${CINEMA_PRECO_PADRAO:28.00}
# Numero minimo de sessoes futuras que cada filme deve sempre ter
app.cinema.minimo-sessoes-futuras=${CINEMA_MIN_SESSOES:3}
# Ate quantos dias a frente novas sessoes podem ser agendadas
app.cinema.dias-sessoes-futuras=${CINEMA_DIAS_SESSOES:14}
# Salas e horarios usados no rodizio de geracao automatica de sessoes
app.cinema.salas=${CINEMA_SALAS:Sala 1,Sala 2,Sala 3,Sala 4}
app.cinema.horarios=${CINEMA_HORARIOS:14:00,17:00,20:00}
app.cinema.capacidade-padrao=${CINEMA_CAPACIDADE_PADRAO:100}
